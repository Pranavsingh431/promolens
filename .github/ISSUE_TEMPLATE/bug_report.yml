name: Bug report
description: Something in PromoLens does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste screenplay text, confidential files, or API keys. Describe the problem in your own words.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Chrome 140 on macOS 26
